
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaCodE</title>

     <link rel="icon" type="image/x-png" href="https://cdn-icons-png.flaticon.com/512/1802/1802977.png">
    
    <!-- External Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.5/split.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-ocean.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

    <style>
        :root {
            --bg: #0f111a;
            --sidebar: #1a1c25;
            --accent: #00e5ff;
            --border: #2e3244;
            --tab-bg: #12141c;
        }

        * { box-sizing: border-box; }

        body, html { 
            margin: 0; 
            padding: 0;
            height: 100%; 
            width: 100%;
            background: var(--bg); 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }

        header {
            height: 55px;
            background: var(--sidebar);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .logo-area { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-weight: 800; 
            font-size: 1.1rem; 
            color: var(--accent); 
        }

        .btn-group { display: flex; gap: 8px; }
        
        .btn {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #252836;
            color: #ccc;
            cursor: pointer;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            user-select: none;
        }

        .btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn-zip { background: #3d5afe; color: white; border: none; }
        .btn-zip:hover { background: #2946ff; color: white; }

        /* Mobile View Switchers */
        .mobile-view-tabs, .mobile-editor-tabs {
            display: none;
            background: var(--tab-bg);
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #676e95;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(0, 229, 255, 0.05);
        }

        .main { 
            display: flex; 
            height: calc(100vh - 55px); 
            width: 100vw;
            position: relative;
        }

        .editor-pane { 
            background: var(--sidebar); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative;
            height: 100%;
        }
        
        .label {
            padding: 8px 15px;
            background: var(--tab-bg);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #676e95;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .preview-container { 
            background: #fff; 
            position: relative; 
            height: 100%;
            width: 100%;
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            background: #fff; 
        }

        /* Split Gutters */
        .gutter { 
            background: var(--bg); 
            position: relative;
            z-index: 5;
        }
        .gutter-horizontal { cursor: col-resize; }
        .gutter-vertical { cursor: row-resize; }

        .CodeMirror { height: 100% !important; font-size: 14px; }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            header { padding: 0 10px; }
            .btn-text { display: none; } /* Hide button labels on small mobile screens */
            .btn { padding: 8px; }

            .mobile-view-tabs {
                display: flex;
                justify-content: space-around;
            }

            .mobile-editor-tabs {
                display: flex;
            }

            .main {
                flex-direction: column;
                height: calc(100vh - 95px); /* Header + Tab bar */
            }

            .gutter { display: none !important; } /* Hide Split gutters on mobile */

            #edit-side, #view-side {
                width: 100% !important;
                height: 100% !important;
            }

            .editor-pane .label { display: none; } /* Hide label bars in tabbed mobile view */

            /* Toggle visibility based on mobile active views */
            body.show-preview #edit-side { display: none; }
            body.show-preview #view-side { display: block; }
            
            body.show-editor #view-side { display: none; }
            body.show-editor #edit-side { display: flex; }

            /* Mobile Tab Switching for Editors */
            body.show-editor #h-box,
            body.show-editor #c-box,
            body.show-editor #j-box {
                display: none;
                height: 100% !important;
            }

            body.show-editor.tab-html #h-box { display: flex; }
            body.show-editor.tab-css #c-box { display: flex; }
            body.show-editor.tab-js #j-box { display: flex; }
        }
    </style>
</head>
<body class="show-editor tab-html">

<header>
    <div class="logo-area"><i data-lucide="layers"></i> InstaCodE</div>
    <div class="btn-group">
        <button class="btn" onclick="clearAll()" title="Clear All"><i data-lucide="trash-2"></i> <span class="btn-text">Clear</span></button>
        <button class="btn" onclick="downloadSingle()" title="Download HTML"><i data-lucide="file-code"></i> <span class="btn-text">Single HTML</span></button>
        <button class="btn btn-zip" onclick="downloadZip()" title="Download ZIP"><i data-lucide="folder-archive"></i> <span class="btn-text">ZIP Project</span></button>
    </div>
</header>

<!-- Mobile Main View Switcher (Editor vs Preview) -->
<div class="mobile-view-tabs">
    <button class="tab-btn active" id="btn-view-editor" onclick="switchMobileView('editor')">
        <i data-lucide="code" size="16"></i> Code Editor
    </button>
    <button class="tab-btn" id="btn-view-preview" onclick="switchMobileView('preview')">
        <i data-lucide="eye" size="16"></i> Live Preview
    </button>
</div>

<div class="main">
    <div id="edit-side" class="editor-pane">
        <!-- Mobile Language Selector -->
        <div class="mobile-editor-tabs">
            <button class="tab-btn active" id="tab-btn-html" onclick="switchMobileEditor('html')">HTML</button>
            <button class="tab-btn" id="tab-btn-css" onclick="switchMobileEditor('css')">CSS</button>
            <button class="tab-btn" id="tab-btn-js" onclick="switchMobileEditor('js')">JS</button>
        </div>

        <div id="h-box" class="editor-pane">
            <div class="label"><span>HTML5</span><i data-lucide="html5" size="14"></i></div>
            <textarea id="html-editor"></textarea>
        </div>
        <div id="c-box" class="editor-pane">
            <div class="label"><span>CSS3</span><i data-lucide="palette" size="14"></i></div>
            <textarea id="css-editor"></textarea>
        </div>
        <div id="j-box" class="editor-pane">
            <div class="label"><span>JavaScript</span><i data-lucide="zap" size="14"></i></div>
            <textarea id="js-editor"></textarea>
        </div>
    </div>
    
    <div id="view-side" class="preview-container">
        <iframe id="preview"></iframe>
    </div>
</div>

<script>
    lucide.createIcons();

    // Init CodeMirror
    const cmCfg = { lineNumbers: true, theme: 'material-ocean', tabSize: 2, lineWrapping: true };
    const htmlEditor = CodeMirror.fromTextArea(document.getElementById('html-editor'), { ...cmCfg, mode: 'xml' });
    const cssEditor = CodeMirror.fromTextArea(document.getElementById('css-editor'), { ...cmCfg, mode: 'css' });
    const jsEditor = CodeMirror.fromTextArea(document.getElementById('js-editor'), { ...cmCfg, mode: 'javascript' });

    let splitHorizontal = null;
    let splitVertical = null;

    function initSplitLayout() {
        if (window.innerWidth > 768) {
            if (!splitHorizontal) {
                splitHorizontal = Split(['#edit-side', '#view-side'], { 
                    sizes: [45, 55], 
                    minSize: 150, 
                    gutterSize: 6 
                });
            }
            if (!splitVertical) {
                splitVertical = Split(['#h-box', '#c-box', '#j-box'], { 
                    direction: 'vertical', 
                    sizes: [33, 33, 34], 
                    minSize: 40, 
                    gutterSize: 6 
                });
            }
        } else {
            if (splitHorizontal) { splitHorizontal.destroy(); splitHorizontal = null; }
            if (splitVertical) { splitVertical.destroy(); splitVertical = null; }
        }
        refreshEditors();
    }

    function refreshEditors() {
        setTimeout(() => {
            htmlEditor.refresh();
            cssEditor.refresh();
            jsEditor.refresh();
        }, 50);
    }

    // Mobile Navigation Controls
    function switchMobileView(view) {
        document.body.classList.remove('show-editor', 'show-preview');
        document.body.classList.add(`show-${view}`);
        
        document.getElementById('btn-view-editor').classList.toggle('active', view === 'editor');
        document.getElementById('btn-view-preview').classList.toggle('active', view === 'preview');

        if (view === 'editor') refreshEditors();
    }

    function switchMobileEditor(lang) {
        document.body.classList.remove('tab-html', 'tab-css', 'tab-js');
        document.body.classList.add(`tab-${lang}`);

        document.getElementById('tab-btn-html').classList.toggle('active', lang === 'html');
        document.getElementById('tab-btn-css').classList.toggle('active', lang === 'css');
        document.getElementById('tab-btn-js').classList.toggle('active', lang === 'js');

        refreshEditors();
    }

    function update() {
        const html = htmlEditor.getValue();
        const css = cssEditor.getValue();
        const js = jsEditor.getValue();
        const frame = document.getElementById('preview');

        const content = `
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <style>${css}</style>
            </head>
            <body>
                ${html}
                <script>
                    try {
                        ${js}
                    } catch (err) {
                        console.error("JS Error: ", err);
                    }
                <\/script>
            </body>
            </html>
        `;
        frame.srcdoc = content;

        // Auto-save
        localStorage.setItem('pro_html', html);
        localStorage.setItem('pro_css', css);
        localStorage.setItem('pro_js', js);
    }

    [htmlEditor, cssEditor, jsEditor].forEach(ed => ed.on('change', () => {
        clearTimeout(window.t);
        window.t = setTimeout(update, 500);
    }));

    // Project Downloads
    function downloadZip() {
        const zip = new JSZip();
        const htmlContent = `<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<link rel="stylesheet" href="style.css">\n</head>\n<body>\n${htmlEditor.getValue()}\n<script src="script.js"><\/script>\n</body>\n</html>`;
        
        zip.file("index.html", htmlContent);
        zip.file("style.css", cssEditor.getValue());
        zip.file("script.js", jsEditor.getValue());
        
        zip.generateAsync({type:"blob"}).then(function(content) {
            saveAs(content, "pro_project.zip");
        });
    }

    function downloadSingle() {
        const full = `<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<style>${cssEditor.getValue()}</style>\n</head>\n<body>\n${htmlEditor.getValue()}\n<script>${jsEditor.getValue()}<\/script>\n</body>\n</html>`;
        const blob = new Blob([full], {type: "text/html"});
        saveAs(blob, "index.html");
    }

    function clearAll() {
        if(confirm("Wipe all editors?")) {
            htmlEditor.setValue('');
            cssEditor.setValue('');
            jsEditor.setValue('');
            update();
        }
    }

    window.addEventListener('resize', initSplitLayout);

    window.onload = () => {
        htmlEditor.setValue(localStorage.getItem('pro_html') || '<!-- Start building! -->\n<div class="card">\n  <h1>InstaCodE</h1>\n  <p>Type code to see magic happen.</p>\n</div>');
        cssEditor.setValue(localStorage.getItem('pro_css') || 'body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }\n.card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }');
        jsEditor.setValue(localStorage.getItem('pro_js') || 'console.log("IDE Ready");');
        
        initSplitLayout();
        update();
    };
</script>
</body>
</html>
